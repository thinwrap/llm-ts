name: CI

# Node 18/20/22 (the package floor is >=18). Runs the lib's own gates:
# typecheck -> vitest -> dual CJS/ESM build -> offline dual-entrypoint import smoke.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=3 --fetch-retry-maxtimeout=15000
        timeout-minutes: 8

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npm run check:dist
